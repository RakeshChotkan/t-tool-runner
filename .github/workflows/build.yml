name: Build image

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 5 1 * *"   # elke maand: nieuwste runner en Python-patches
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          pull: true
          push: true
          platforms: linux/amd64
          tags: ghcr.io/rakeshchotkan/t-tool-runner:latest
